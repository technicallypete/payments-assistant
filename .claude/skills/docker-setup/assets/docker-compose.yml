services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-myapp}
      POSTGRES_USER: ${DB_ADMIN_USER:-admin}
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD:-admin}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d   # 01-roles.sql runs once at first start
    ports:
      - "${DB_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_ADMIN_USER:-admin}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # One-shot: runs migrations as the superuser (admin owns every table).
  # Every service that touches the DB waits on this completing.
  api-migrate:
    build:
      context: ./api
      dockerfile: ../docker/Dockerfile.api
    command: uv run python manage.py migrate --noinput
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${DB_ADMIN_USER:-admin}:${DB_ADMIN_PASSWORD:-admin}@postgres:5432/${DB_NAME:-myapp}
      - DJANGO_SETTINGS_MODULE=config.settings.dev
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # REST surface of the ./api backend — connects as the least-privilege `web` role.
  api-web:
    build:
      context: ./api
      dockerfile: ../docker/Dockerfile.api
    command: uv run uvicorn config.asgi:application --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./api:/app
      - /app/.venv
    ports:
      - "${API_WEB_HOST_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://web:${WEB_DB_PASSWORD:-web}@postgres:5432/${DB_NAME:-myapp}
      - S3_ENDPOINT=http://minio:9000
      - S3_BUCKET=${S3_BUCKET:-myapp}
      - S3_KEY=${S3_KEY:-minio}
      - S3_SECRET=${S3_SECRET:-minio123}
      - S3_FORCE_PATH_STYLE=true
      - S3_PUBLIC_BASE_URL=http://localhost:${S3_API_PORT:-9000}/${S3_BUCKET:-myapp}
      - DJANGO_SETTINGS_MODULE=config.settings.dev
      - MCP_MOUNT_ENABLED=false        # REST-only on this port
    depends_on:
      api-migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  # MCP surface of the ./api backend — same image, connects as the `mcp` role.
  api-mcp:
    build:
      context: ./api
      dockerfile: ../docker/Dockerfile.api
    command: uv run uvicorn config.asgi:application --host 0.0.0.0 --port 8001 --reload
    volumes:
      - ./api:/app
      - /app/.venv
    ports:
      - "${API_MCP_HOST_PORT:-8001}:8001"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://mcp:${MCP_DB_PASSWORD:-mcp}@postgres:5432/${DB_NAME:-myapp}
      - S3_ENDPOINT=http://minio:9000
      - S3_BUCKET=${S3_BUCKET:-myapp}
      - S3_KEY=${S3_KEY:-minio}
      - S3_SECRET=${S3_SECRET:-minio123}
      - S3_FORCE_PATH_STYLE=true
      - DJANGO_SETTINGS_MODULE=config.settings.dev
      - MCP_MOUNT_ENABLED=true         # /mcp mounted on this port
    depends_on:
      api-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/health')\" || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  app:
    build:
      context: ./app
      dockerfile: ../docker/Dockerfile.app
    command: bun run dev
    ports:
      - "${APP_HOST_PORT:-3000}:3000"
    volumes:
      - ./app:/app
      - /app/node_modules
    env_file:
      - .env
    environment:
      # Frontend talks to the REST surface over HTTP — no direct DB access.
      - API_URL=http://api-web:8000
      - NEXT_PUBLIC_API_URL=http://localhost:${API_WEB_HOST_PORT:-8000}
      - WATCHPACK_POLLING=true          # remove on Linux hosts if inotify works
    depends_on:
      api-web:
        condition: service_healthy

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_KEY:-minio}
      MINIO_ROOT_PASSWORD: ${S3_SECRET:-minio123}
    volumes:
      - minio-data:/data
    ports:
      - "${S3_API_PORT:-9000}:9000"
      - "${S3_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/minio:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      sh -c "mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
             mc mb --ignore-existing local/${S3_BUCKET:-myapp} &&
             mc anonymous set download local/${S3_BUCKET:-myapp}/public"
    environment:
      MINIO_ROOT_USER: ${S3_KEY:-minio}
      MINIO_ROOT_PASSWORD: ${S3_SECRET:-minio123}
    restart: "no"

volumes:
  postgres-data:
  minio-data:
