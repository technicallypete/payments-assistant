[project]
name = "payments-assistant"
version = "0.1.0"
description = "AI payments assistant: owner web API, Telegram customer bot, Stripe webhooks"
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2",
    "pydantic-settings",
    "sqlalchemy[asyncio]>=2",
    "psycopg[binary]>=3.2",
    "alembic",
    "httpx",
    "stripe>=16.0.0",
    "argon2-cffi>=25.1.0",
    "langchain-core>=1.6.6",
    "langchain>=1.4.3",
    "langchain-openai>=1.6.7",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "ruff",
    "time-machine>=3.5.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/payments_assistant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "-ra --strict-markers"
markers = [
    "integration: needs the compose Postgres (run in the api-test service)",
    "stripe: hits the real Stripe test account (opt-in)",
    "llm_eval: calls the real LLM via OpenRouter (opt-in, costs money)",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S", "SIM"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S107"]
"alembic/versions/*" = ["E501"]  # hand-written SQL reads better unwrapped

[tool.coverage.run]
source = ["payments_assistant"]
branch = true
# Async SQLAlchemy runs DB work in greenlets; without this, lines after awaits look uncovered.
concurrency = ["greenlet", "thread"]
